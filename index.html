<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1114">
<title>Configurador de mesa de pino</title>
<style>
:root{--bg:#0f1114;--panel:#16191e;--ink:#eceae4;--mute:#8d939b;--line:#272b33;--acc:#d9b67a;--acc2:#1d2127;--warn:#e7a04f;--alert:#e5604f;--ok:#84c39a;--sh:0 12px 32px rgba(0,0,0,.35)}
body.light{--bg:#eeece7;--panel:#fff;--ink:#1d1d1b;--mute:#6f6d67;--line:#e3e0d8;--acc:#8a6a34;--acc2:#f4f1ea;--warn:#b86a1f;--alert:#b3402e;--ok:#3d7a52;--sh:0 12px 32px rgba(0,0,0,.08)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:1fr 390px;height:100vh;overflow:hidden;transition:background .4s,color .4s}
#view{position:relative;min-height:320px;overflow:hidden}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#bar{position:absolute;left:12px;top:12px;display:flex;gap:6px}
.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;transition:all .25s;box-shadow:var(--sh)}
.btn:hover{border-color:var(--acc)}
#card{position:absolute;left:12px;top:60px;width:310px;max-width:calc(100% - 24px);max-height:calc(100% - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);animation:fade .3s ease}
#card h4{margin:0 0 6px;font-size:14px}#card p{margin:6px 0;font-size:12.5px}
#card svg{width:100%;height:auto;margin:6px 0}
#card svg text{fill:var(--mute);font-size:11px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#hud{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--mute);background:var(--panel);padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
#tip{position:absolute;right:12px;bottom:14px;font-size:12px;color:var(--mute);text-align:right;max-width:60%}
#panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 18px 40px}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;color:var(--mute);font:inherit;padding:8px 7px;cursor:pointer;border-bottom:2px solid transparent;transition:all .25s}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
section[data-pane]{animation:fade .35s ease}
[hidden]{display:none!important}
h3{font-size:12px;font-weight:600;color:var(--mute);margin:16px 0 6px}
details{border-top:1px solid var(--line);padding:6px 0}
details summary{cursor:pointer;font-weight:600;font-size:13px;padding:4px 0;list-style:none}
details summary::before{content:"▸ ";color:var(--acc)}
details[open] summary::before{content:"▾ "}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--acc2);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;transition:all .25s}
.seg button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.seg small{display:block;color:var(--mute);font-size:11px;line-height:1.3}
label.r{display:block;margin:9px 0}
label.r span{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
label.r b{color:var(--ink);font-weight:500}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number],input[type=text],select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--acc2);color:var(--ink)}
label.c{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13px;cursor:pointer}
.adv{padding:8px 10px;border-radius:10px;margin:6px 0;font-size:12.5px;border-left:3px solid var(--mute);background:var(--acc2);animation:fade .4s}
.adv.alta{border-color:var(--alert)}.adv.media{border-color:var(--warn)}.adv.ok{border-color:var(--ok)}
.ev{padding:9px 0;border-bottom:1px solid var(--line)}
.ev b{font-weight:600;font-size:13px}.ev em{font-style:normal;font-size:12px;color:var(--acc);display:block}.ev small{color:var(--mute);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500}
tr.cur td{color:var(--acc)}
.muted{color:var(--mute);font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.steps{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.steps .btn{padding:5px 10px;font-size:12px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(400px,92vw);max-height:85vh;overflow:auto;box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;min-height:100dvh;overflow:auto}
  #view{height:60dvh;min-height:300px}
  #bar{top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;overflow-x:auto;scrollbar-width:none}
  #bar .btn{white-space:nowrap;min-height:40px;padding:8px 14px}
  #hud{left:8px;bottom:8px;font-size:11px}
  #tip{display:none}
  #card{left:8px;right:8px;top:56px;width:auto;max-width:none;max-height:calc(100% - 70px)}
  #panel{border-left:0;border-top:1px solid var(--line);overflow:visible;padding:12px 14px calc(30px + env(safe-area-inset-bottom));font-size:15px}
  nav.tabs{position:sticky;top:0;background:var(--panel);z-index:2;flex-wrap:nowrap;overflow-x:auto}
  nav.tabs button{flex:1 0 auto;padding:12px 8px;font-size:14px}
  .btn{min-height:40px}
  .seg{grid-template-columns:1fr}
  input[type=range]{height:30px}
  label.r span{font-size:13px}
  dialog{width:92vw}
}
</style>
</head>
<body>
<div id="view">
  <div id="bar"><button class="btn" id="theme"></button><button class="btn" id="reset">Restablecer vista</button></div>
  <div id="card" hidden></div>
  <div id="hud"></div>
  <div id="tip">Doble clic: seleccionar y ver cotas · Clic derecho: editar medidas</div>
</div>

<aside id="panel">
  <nav class="tabs">
    <button class="on" data-tab="diseno">Diseño</button>
    <button data-tab="medidas">Medidas</button>
    <button data-tab="corte">Corte</button>
    <button data-tab="armado">Armado</button>
    <button data-tab="eval">Evaluación</button>
  </nav>
  <div id="warns"></div>

  <section data-pane="diseno">
    <h3>Tipo de patas</h3>
    <div id="designs" class="seg"></div>
    <h3>Visualización</h3>
    <label class="c"><input type="checkbox" data-k="showBoard"> Mostrar tablero</label>
    <label class="c"><input type="checkbox" data-k="showHW"> Mostrar herrajes</label>
    <label class="c"><input type="checkbox" data-k="explode"> Vista explotada</label>
    <label class="c"><input type="checkbox" data-k="transl"> Tablero translúcido</label>
    <label class="c"><input type="checkbox" data-k="zone"> Zona estimada para piernas</label>
    <label class="c"><input type="checkbox" data-k="dims"> Cotas generales</label>
  </section>

  <section data-pane="medidas" hidden>
    <h3>Tablero</h3><div id="fb"></div>
    <h3>Estructura</h3><div id="fs"></div>
  </section>

  <section data-pane="corte" hidden>
    <h3>Tablas de pino compradas</h3>
    <div class="row2">
      <label class="muted">Largo de cada tabla (mm)<input type="number" data-k="bar" min="500" step="10"></label>
      <label class="muted">Cantidad de tablas<input type="number" data-k="bars" min="1" step="1"></label>
      <label class="muted">Espesor de corte (mm)<input type="number" data-k="kerf" min="0" step="0.5"></label>
      <label class="muted">Sección de las tablas<input type="text" data-k="secc" placeholder="A confirmar"></label>
    </div>
    <div id="cut"></div>
  </section>

  <section data-pane="armado" hidden>
    <h3>Armado paso a paso</h3>
    <div id="stepbox"></div>
    <div class="steps" id="steps">
      <button class="btn" data-go="prev">Anterior</button>
      <button class="btn" data-go="all">Ver todo</button>
      <button class="btn" data-go="next">Siguiente</button>
    </div>
    <h3>Herrajes</h3>
    <div id="hwlist"></div>
  </section>

  <section data-pane="eval" hidden>
    <div id="evalbox"></div>
    <h3>Comparador</h3>
    <div id="cmp"></div>
  </section>
</aside>

<dialog id="dlg">
  <h3 id="dlgT" style="color:var(--ink);font-size:15px;margin-top:0"></h3>
  <div id="dlgF"></div>
  <p style="text-align:right;margin:12px 0 0"><button class="btn" id="dlgX">Cerrar</button></p>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('es-AR');
const V3 = THREE.Vector3;

// ---------- Estado (mm) ----------
const S = {preset:'X2', shape:'oval', n:2.2, L:2000, W:1200, T:40, R:150, H:740, s:60, inset:250, F:420,
  hole:true, holeX:420, holeZ:420, holeD:70,
  showBoard:true, showHW:false, explode:false, transl:false, zone:false, dims:false,
  riostra:'no', fijRio:'tornillo', dH:0.35, dR:250, dS:60,
  bar:6000, bars:1, kerf:3, secc:'', theme:'dark', step:0};
let sel = null; // clave de la pieza seleccionada: 's3', 'b0', 'h5'

// Patas: X, A, U, E (caballetes), D (cuatro patas). tt = travesaño trasero alto; tb = trasero al piso
const PRESETS = {
  X2:{n:'Dos X',d:'Idea original. Centro libre.',legs:'X',ties:[]},
  X2T:{n:'Dos X + trasero alto',d:'Travesaño atrás, bajo el tablero.',legs:'X',ties:['tt']},
  X2B:{n:'Dos X + trasero al piso',d:'Travesaño atrás, junto al suelo.',legs:'X',ties:['tb']},
  X2TB:{n:'Dos X + trasero doble',d:'Alto y bajo, solo atrás.',legs:'X',ties:['tt','tb']},
  A:{n:'Patas en A',d:'Inclinadas hacia el centro.',legs:'A',ties:[]},
  AT:{n:'Patas en A + trasero',d:'Con travesaño trasero alto.',legs:'A',ties:['tt']},
  U:{n:'Patas en U',d:'Patas rectas con barra de pie.',legs:'U',ties:[]},
  UT:{n:'Patas en U + trasero',d:'Con travesaño trasero alto.',legs:'U',ties:['tt']},
  E:{n:'Caballetes',d:'Patas abiertas a lo largo.',legs:'E',ties:[]},
  D:{n:'Cuatro patas',d:'Rectas en las esquinas.',legs:'D',ties:[]},
  DT:{n:'Cuatro patas + trasero alto',d:'Refuerzo trasero bajo el tablero.',legs:'D',ties:['tt']},
  DB:{n:'Cuatro patas + trasero bajo',d:'Refuerzo trasero junto al suelo.',legs:'D',ties:['tb']}
};
const STEPS = [
  {t:'Cortar las piezas', x:'Corte todas las piezas según la pestaña Corte. Revise la escuadra de cada corte antes de seguir.', roles:['leg','apron','tie','brace']},
  {t:'Armar las patas', x:'Arme cada X sobre el piso. Las dos patas se cruzan en el centro con media madera: cada una rebaja la mitad de su grosor en el cruce. Fíjelas con bulón, arandela y tuerca.', roles:['leg']},
  {t:'Unir el travesaño superior', x:'El travesaño va entre los extremos superiores de las patas, a tope con ellas. Fíjelo con cola y dos tornillos por extremo, desde el lateral.', roles:['apron']},
  {t:'Diagonales y travesaño trasero', x:'Cada diagonal va desde la pata hasta el travesaño, formando un triángulo. Fíjela con dos tornillos por extremo, con pre-taladrado. El travesaño trasero, si lo tiene, va igual.', roles:['tie','brace']},
  {t:'Fijar el tablero desde abajo', x:'Dé vuelta el tablero sobre una superficie blanda y centre la estructura. Un tornillo fijo en el centro de cada travesaño y clips de expansión en los demás puntos.', roles:['apron','leg','tie','brace'], hw:true}
];
const BOARD_G = [
  {t:'Forma del tablero', f:[['shape','Forma','sel',[['oval','Óvalo'],['rect','Rectángulo con puntas redondeadas']]],['n','Curvatura del óvalo (2 = elipse, 4 = cuadrado)',2,4,0.1,''],['R','Radio de puntas (solo rectángulo)',0,400,5,'mm']]},
  {t:'Medidas del tablero', f:[['L','Largo',1500,2600,10,'mm'],['W','Ancho',800,1600,10,'mm'],['T','Grosor (provisional)',20,60,1,'mm']]},
  {t:'Agujero para cables', f:[['hole','Mostrar agujero','chk'],['holeD','Diámetro',30,120,5,'mm'],['holeX','Posición a lo largo (X)',-900,900,5,'mm'],['holeZ','Posición a lo ancho (Z, + frente)',-600,600,5,'mm']],
    extra:'<div class="row2"><button class="btn" data-corner="1,1">Frente +X</button><button class="btn" data-corner="-1,1">Frente −X</button><button class="btn" data-corner="1,-1">Fondo +X</button><button class="btn" data-corner="-1,-1">Fondo −X</button></div>'}
];
const STRUCT_G = [
  {t:'Altura y secciones', f:[['H','Altura total',600,900,5,'mm'],['s','Sección de patas y travesaños',40,120,2,'mm']]},
  {t:'Apoyo de las patas', f:[['inset','Separación de extremos al apoyo',150,500,5,'mm'],['F','Apertura de patas (media)',250,700,5,'mm']]},
  {t:'Diagonales (triángulos bajo el tablero)', f:[['riostra','Diagonales','sel',[['no','Sin diagonales'],['int','Por dentro de las patas (zona de piernas)'],['ext','Por fuera de las patas'],['ambas','Por dentro y por fuera']]],
    ['dH','Altura de apoyo en la pata (0,15 a 0,85)',0.15,0.85,0.05,''],['dR','Llegada al travesaño (0 = en la pata, 420 = centro)',0,600,10,'mm'],['dS','Sección de cada diagonal',40,120,2,'mm'],
    ['fijRio','Fijación','sel',[['tornillo','Tornillos para madera'],['clavo','Clavos con cola (complemento)']]]],
    extra:'<p class="muted">Cada diagonal forma un triángulo con la pata y el travesaño. La altura de apoyo cambia el ángulo; la llegada decide si las dos diagonales se juntan en el centro.</p>'}
];
function fieldHTML([k,l,a,b,c,u]){
  if(a==='chk') return `<label class="c"><input type="checkbox" data-k="${k}"> ${l}</label>`;
  if(a==='sel') return `<label class="r"><span>${l}</span><select data-k="${k}">${b.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label>`;
  return `<label class="r"><span>${l}<b data-o="${k}"></b></span><input type="range" data-k="${k}" data-u="${u}" min="${a}" max="${b}" step="${c}"></label>`;
}
const groupsHTML = G => G.map(g => `<details open><summary>${g.t}</summary>${g.f.map(fieldHTML).join('')}${g.extra||''}</details>`).join('');

// ---------- Escena ----------
const view = $('view');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x555a62, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(3, 5, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-3, right:3, top:3, bottom:-3, far:20});
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({opacity:0.35}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grp = new THREE.Group(); grp.scale.setScalar(0.001); scene.add(grp);
const dyn = [];

function pineTex(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 512;
  const g = c.getContext('2d'); g.fillStyle = '#e2c18d'; g.fillRect(0, 0, 256, 512);
  for (let i = 0; i < 90; i++) {
    g.strokeStyle = `rgba(150,95,40,${Math.random() * 0.22})`;
    g.lineWidth = Math.random() * 2 + 0.4;
    g.beginPath(); const x0 = Math.random() * 256; g.moveTo(x0, 0);
    for (let y = 0; y <= 512; y += 32) g.lineTo(x0 + Math.sin(y * 0.03 + i) * 3, y);
    g.stroke();
  }
  return new THREE.CanvasTexture(c);
}
const pineMat = new THREE.MeshStandardMaterial({map: pineTex(), roughness: 0.7});
const ghostMat = new THREE.MeshStandardMaterial({map: pineMat.map, roughness: 0.7, transparent: true, opacity: 0.12, depthWrite: false});
const boardMat = new THREE.MeshStandardMaterial({color: 0xece4d2, roughness: 0.5});
const ghostBoard = new THREE.MeshStandardMaterial({color: 0xece4d2, transparent: true, opacity: 0.12, depthWrite: false});
const hwMat = new THREE.MeshStandardMaterial({color: 0x9a9a96, metalness: 0.8, roughness: 0.35});
const zoneMat = new THREE.MeshBasicMaterial({color: 0x6f9a8c, transparent: true, opacity: 0.18, depthWrite: false});
const dimMat = new THREE.LineBasicMaterial({color: 0x9aa3ad});

// ---------- Geometría ----------
// Piezas: [punto A, punto B, papel, opciones]. Papel: leg | apron | tie | brace
// Opciones: {cross:'L'|'R'} = media madera en el cruce de la X; {w} = sección propia
function braces(p){
  const P = PRESETS[p];
  if (P.legs !== 'X' || S.riostra === 'no') return [];
  const {s, inset, F, H, T, L} = S, xe = L/2 - inset, lt = H - T, out = [];
  const sides = S.riostra === 'int' ? [-1] : S.riostra === 'ext' ? [1] : [-1, 1];
  const h = S.dH * lt, reach = Math.min(S.dR, F);
  for (const e of [-1, 1]) for (const sd of sides) {
    const x = e * xe + sd * e * s;                  // por dentro (hacia el centro) o por fuera
    for (const zs of [-1, 1])                       // una diagonal por cada pata
      out.push([[x, h, zs * (F - 2*F*h/lt)], [x, lt - s/2, zs * (F - reach)], 'brace', {w: S.dS}]);
  }
  return out;
}
function members(p){
  const {L,W,H,T,s,inset,F} = S, xe = L/2 - inset, lt = H - T, c = 60, zt = W/2 - 100, P = PRESETS[p], M = [];
  // Travesaño entre las patas: termina a tope con las patas (no las atraviesa)
  const X = x => { M.push([[x,0,-F],[x,lt,F],'leg',{cross:'L'}],[[x,0,F],[x,lt,-F],'leg',{cross:'R'}],[[x,lt-s/2,-F+s/2],[x,lt-s/2,F-s/2],'apron']); };
  const A = x => M.push([[x,0,-F],[x,lt,-c],'leg'],[[x,0,F],[x,lt,c],'leg'],[[x,lt-s/2,-c+s/2],[x,lt-s/2,c-s/2],'apron']);
  const U = x => M.push([[x,0,-F],[x,lt,-F],'leg'],[[x,0,F],[x,lt,F],'leg'],[[x,s/2,-F],[x,s/2,F],'tie'],[[x,lt-s/2,-F+s/2],[x,lt-s/2,F-s/2],'apron']);
  const Tr = z => M.push([[-F,0,z],[-c,lt,z],'leg'],[[F,0,z],[c,lt,z],'leg'],[[-c,lt-s/2,z],[c,lt-s/2,z],'apron']);
  const D = () => { for (const x of [-xe, xe]) for (const z of [-F, F]) M.push([[x,0,z],[x,lt,z],'leg']);
                    for (const x of [-xe, xe]) M.push([[x,lt-s/2,-F+s/2],[x,lt-s/2,F-s/2],'apron']); };
  if (P.legs === 'X') { X(-xe); X(xe); }
  if (P.legs === 'A') { A(-xe); A(xe); }
  if (P.legs === 'U') { U(-xe); U(xe); }
  if (P.legs === 'E') { Tr(-zt); Tr(zt); }
  if (P.legs === 'D') D();
  const zb = P.legs === 'A' ? -c : -F;
  if (P.ties.includes('tt')) M.push([[-xe, lt-s/2, zb],[xe, lt-s/2, zb],'tie']);
  if (P.ties.includes('tb')) M.push([[-xe, s/2, -F],[xe, s/2, -F],'tie']);
  braces(p).forEach(b => M.push(b));
  return M;
}
const lenOf = (a, b) => Math.hypot(b[0]-a[0], b[1]-a[1], b[2]-a[2]);

function holeOK(){
  const r = S.holeD/2 + 15;
  for (let i = 0; i < 16; i++) {
    const th = i/16 * Math.PI*2;
    if (!insideBoard(S.holeX + r*Math.cos(th), S.holeZ + r*Math.sin(th))) return false;
  }
  return true;
}
function insideBoard(x, z){
  if (S.shape === 'rect') return Math.abs(x) <= S.L/2 && Math.abs(z) <= S.W/2;
  return Math.pow(Math.abs(x)/(S.L/2), S.n) + Math.pow(Math.abs(z)/(S.W/2), S.n) <= 1;
}
function boardShape(){
  const sh = new THREE.Shape();
  if (S.shape === 'oval') {
    const N = 180;
    for (let i = 0; i <= N; i++) {
      const th = i / N * Math.PI * 2, c = Math.cos(th), s_ = Math.sin(th);
      const x = (S.L/2) * Math.sign(c) * Math.pow(Math.abs(c), 2/S.n);
      const y = (S.W/2) * Math.sign(s_) * Math.pow(Math.abs(s_), 2/S.n);
      if (i === 0) sh.moveTo(x, y); else sh.lineTo(x, y);
    }
  } else {
    const r = Math.max(0, Math.min(S.R, S.W/2 - 1, S.L/2 - 1)), x = -S.L/2, y = -S.W/2, w = S.L, h = S.W;
    sh.moveTo(x + r, y); sh.lineTo(x + w - r, y); sh.quadraticCurveTo(x + w, y, x + w, y + r);
    sh.lineTo(x + w, y + h - r); sh.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    sh.lineTo(x + r, y + h); sh.quadraticCurveTo(x, y + h, x, y + h - r);
    sh.lineTo(x, y + r); sh.quadraticCurveTo(x, y, x + r, y);
  }
  if (S.hole) {
    const p = new THREE.Path();                    // en la forma, y = -Z
    p.absarc(S.holeX, -S.holeZ, S.holeD/2, 0, Math.PI * 2, true); sh.holes.push(p);
  }
  return sh;
}
function label(t, p){
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const g = c.getContext('2d'); g.font = '44px sans-serif'; g.fillStyle = '#e8e6df';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t, 256, 48);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(c), depthTest: false}));
  sp.scale.set(420, 79, 1); sp.position.copy(p); return sp;
}
function lineObj(pts){ return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), dimMat); }
function bar(P1, P2, wx, wz){
  const d = P2.clone().sub(P1), len = d.length();
  const m = new THREE.Mesh(new THREE.BoxGeometry(wx, len, wz), pineMat);
  m.quaternion.setFromUnitVectors(new V3(0, 1, 0), d.clone().normalize());
  m.position.copy(P1.clone().add(P2).multiplyScalar(0.5));
  return m;
}

// Herrajes. Medidas estándar donde existen; el clip de expansión no tiene una medida única.
const BULON_L = Math.ceil((S.s + 3.2 + 8) / 5) * 5;   // largo para atravesar el cruce con dos arandelas y la tuerca
function hwText(u){
  return {tornillo:`Tornillo para madera Ø5 × ${u.l} mm`, clip:'Clip de expansión (orientativo 30 × 8 × 14 mm)',
    perno:`Bulón M8 × ${u.l} mm`, arandela:'Arandela plana M8 (16 × 1.6 mm)', tuerca:'Tuerca autoblocante M8 (altura 8 mm)',
    clavo:`Clavo Ø3 × ${u.l} mm`}[u.t];
}

function rebuild(){
  dyn.forEach(o => grp.remove(o)); dyn.length = 0;
  const M = members(S.preset), P = PRESETS[S.preset], lt = S.H - S.T, xe = S.L/2 - S.inset, center = new V3(0, S.H/2, 0);
  const add = o => { grp.add(o); dyn.push(o); return o; };
  const byKey = {};
  const reg = (key, mesh) => { (byKey[key] = byKey[key] || []).push(mesh); return mesh; };

  M.forEach(([a, b, role, opt], i) => {
    const A = new V3(...a), B = new V3(...b), mid = A.clone().add(B).multiplyScalar(0.5), d = B.clone().sub(A);
    const ang = Math.round(Math.atan2(Math.hypot(d.x, d.z), Math.abs(d.y)) * 180 / Math.PI);
    const ud = {kind:'struct', role, len: Math.round(d.length()), ang, a, b, id: i, key: 's' + i};
    const offv = S.explode ? mid.clone().sub(center).multiplyScalar(0.6) : null;
    let parts;
    if (opt && opt.cross) {
      // Media madera: cada pata pierde la mitad de su grosor en el cruce
      const u = d.clone().normalize(), h = S.s/2, C = mid;
      const p1 = C.clone().sub(u.clone().multiplyScalar(h)), p2 = C.clone().add(u.clone().multiplyScalar(h));
      const cb = bar(p1, p2, S.s/2, S.s);
      cb.position.x += opt.cross === 'L' ? -S.s/4 : S.s/4;
      parts = [bar(A, p1, S.s, S.s), bar(p2, B, S.s, S.s), cb];
    } else {
      parts = [bar(A, B, (opt && opt.w) || S.s, (opt && opt.w) || S.s)];
    }
    parts.forEach(m => {
      if (offv) m.position.add(offv);
      m.castShadow = true; m.userData = ud; add(m); reg(ud.key, m);
    });
  });

  const geo = new THREE.ExtrudeGeometry(boardShape(), {depth: S.T, bevelEnabled: false, curveSegments: 32});
  geo.rotateX(-Math.PI / 2);
  const bd = add(new THREE.Mesh(geo, boardMat));
  bd.position.y = S.H - S.T + (S.explode ? 250 : 0);
  bd.castShadow = bd.receiveShadow = true;
  bd.userData = {kind:'board', id: 0, key: 'b0'}; bd.visible = S.showBoard;
  reg('b0', bd);
  boardMat.transparent = S.transl; boardMat.opacity = S.transl ? 0.3 : 1; boardMat.depthWrite = !S.transl;

  // Herrajes
  const hw = []; let hid = 0;
  const H_ = (mesh, t, l) => { mesh.userData = {kind:'hw', t, l, id: hid, key: 'h' + hid}; hid++; hw.push(mesh); reg(mesh.userData.key, mesh); return mesh; };
  M.forEach(([a, b, role]) => {
    if (role !== 'apron') return;
    const len = lenOf(a, b), spots = [{t:0.5, k:'tornillo'}];
    if (len > 900) spots.push({t:0.5 - 400/len, k:'clip'}, {t:0.5 + 400/len, k:'clip'});
    spots.forEach(({t, k}) => {
      const x = a[0] + (b[0]-a[0])*t, z = a[2] + (b[2]-a[2])*t;
      if (k === 'tornillo') H_(new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 25, 10), hwMat), 'tornillo', 25).position.set(x, lt + 12.5, z);
      else H_(new THREE.Mesh(new THREE.BoxGeometry(30, 8, 14), hwMat), 'clip', 0).position.set(x, lt - 4, z);
    });
  });
  M.forEach(([a, b, role, opt]) => {
    if (role !== 'brace') return;
    const t = S.fijRio === 'clavo' ? 'clavo' : 'tornillo', l = t === 'clavo' ? 65 : 50, g = t === 'clavo' ? 1.5 : 2.5;
    [a, b].forEach(p => {
      const m = H_(new THREE.Mesh(new THREE.CylinderGeometry(g, g, l, 8), hwMat), t, l);
      m.rotation.z = Math.PI / 2; m.position.set(p[0], p[1], p[2]);
    });
  });
  if (P.legs === 'X') for (const x of [-xe, xe]) {
    const bolt = H_(new THREE.Mesh(new THREE.CylinderGeometry(4, 4, BULON_L, 12), hwMat), 'perno', BULON_L);
    bolt.rotation.z = Math.PI / 2; bolt.position.set(x, lt/2, 0);
    for (const dx of [-1, 1]) {
      const w = H_(new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 1.6, 16), hwMat), 'arandela', 1.6);
      w.rotation.z = Math.PI / 2; w.position.set(x + dx * (S.s/2 + 0.8), lt/2, 0);
    }
    const n = H_(new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 8, 6), hwMat), 'tuerca', 8);
    n.rotation.z = Math.PI / 2; n.position.set(x - (S.s/2 + 4), lt/2, 0);
  }
  hw.forEach(o => { o.visible = S.showHW && !S.explode; add(o); });

  // Zona estimada para piernas (frente = +Z)
  const innerW = 2*xe - S.s;
  const zone = add(new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), zoneMat));
  zone.scale.set(innerW, 700, 600); zone.position.set(0, 350, S.W/2 - 300); zone.visible = S.zone;
  zone.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({color: 0x6f9a8c})));

  // Cotas generales
  const hx = S.L/2, hz = S.W/2, top = S.H;
  [lineObj([new V3(-hx, top+120, hz+150), new V3(hx, top+120, hz+150)]),
   lineObj([new V3(hx+150, top+120, -hz), new V3(hx+150, top+120, hz)]),
   lineObj([new V3(-hx-150, 0, hz), new V3(-hx-150, top, hz)]),
   label(`Largo ${S.L} mm`, new V3(0, top+170, hz+150)),
   label(`Ancho ${S.W} mm`, new V3(hx+150, top+170, 0)),
   label(`Altura ${S.H} mm`, new V3(-hx-150, top/2, hz+90))
  ].forEach(o => { o.visible = S.dims; add(o); });

  // Selección: contorno verde en todas las partes y cotas específicas (una sola vez)
  if (sel && byKey[sel]) byKey[sel].forEach((m, k) => addSel(m, m.userData, add, k === 0));
  return M;
}

function addSel(mesh, u, add, withDims){
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), new THREE.LineBasicMaterial({color: 0x5fe38a})));
  if (!withDims) return;
  if (u.kind === 'struct') {
    const A = new V3(...u.a), B = new V3(...u.b), dir = B.clone().sub(A).normalize();
    let perp = new V3().crossVectors(dir, new V3(0, 1, 0));
    if (perp.length() < 1e-3) perp = new V3(1, 0, 0);
    perp.normalize();
    const w = (u.role === 'brace' ? S.dS : S.s);
    const off = perp.clone().multiplyScalar(w + 60);
    add(lineObj([A.clone().add(off), B.clone().add(off)]));
    add(label(`${u.len} mm`, A.clone().add(B).multiplyScalar(0.5).add(off).add(new V3(0, 45, 0))));
    add(label(`Sección ${w} × ${w} mm`, A.clone().add(off.clone().multiplyScalar(0.5)).add(new V3(0, -45, 0))));
    if (u.ang > 0) add(label(`${u.ang}° respecto a la vertical`, B.clone().add(off).add(new V3(0, 60, 0))));
  } else if (u.kind === 'hw') {
    add(label(hwText(u), mesh.position.clone().add(new V3(0, 90, 0))));
  } else {
    add(label(`Tablero ${fmt(S.L)} × ${fmt(S.W)} × ${S.T} mm`, new V3(0, S.H + 90, 0)));
  }
}

// Resalta los pasos del tutorial; el resto queda fantasma
function applyStep(){
  const st = S.step ? STEPS[S.step - 1] : null;
  dyn.forEach(o => {
    if (!o.isMesh) return;
    const u = o.userData;
    if (u.kind === 'struct') o.material = !st || st.roles.includes(u.role) ? pineMat : ghostMat;
    if (u.kind === 'board') o.material = !st || st.hw ? boardMat : ghostBoard;
    if (u.kind === 'hw') o.visible = st ? !!st.hw : (S.showHW && !S.explode);
  });
}

// ---------- Cálculos y advertencias ----------
function interfHit(M){
  const xe = S.L/2 - S.inset, half = xe, zMin = S.W/2 - 600 - S.s/2;
  for (const [a, b] of M) for (let t = 0; t <= 1; t += 0.05) {
    const x = a[0] + (b[0]-a[0])*t, y = a[1] + (b[1]-a[1])*t, z = a[2] + (b[2]-a[2])*t;
    if (Math.abs(x) < half && z >= zMin && y < 700) return true;
  }
  return false;
}
function cutPlan(M){
  const BL = S.bar, K = S.kerf;
  const arr = M.map(([a, b]) => Math.round(lenOf(a, b))).sort((x, y) => y - x);
  const over = arr.filter(l => l > BL), bars = [];
  for (const l of arr) {
    if (l > BL) continue;
    let bar = bars.find(br => br.used + l + K <= BL + K);
    if (!bar) { bar = {used:0, items:[]}; bars.push(bar); }
    bar.used += l + K; bar.items.push(l);
  }
  return {bars, nb: bars.length, over, total: arr.reduce((t, l) => t + l, 0), BL};
}
function H_tip(){ return S.H / (2 * (PRESETS[S.preset].legs === 'E' ? S.W/2 - 100 : S.F)); }
function validate(M){
  const w = [], lt = S.H - S.T, xe = S.L/2 - S.inset, innerW = 2*xe - S.s, P = PRESETS[S.preset];
  const tip = H_tip();
  if (tip > 1.0) w.push({s:'alta', t:`Puede volcarse hacia un lado: la base es estrecha para esta altura (relación ${tip.toFixed(2)}, estimación).`});
  else if (tip > 0.9) w.push({s:'media', t:'La base es algo estrecha: cuidado al apoyarse en un borde.'});
  if (!P.ties.length && S.riostra === 'no') w.push({s:'media', t:'Sin travesaño trasero ni diagonales, la mesa puede moverse de lado o torcerse al empujarla. Pruebe con diagonales exteriores o un diseño con "trasero".'});
  else w.push({s:'info', t:'Las diagonales y el travesaño trasero evitan el giro. Las exteriores no ocupan la zona de piernas.'});
  if (P.legs === 'A' || P.legs === 'U') w.push({s:'info', t:'La unión de arriba de las patas recibe mucha carga: use cola y tornillos, no solo tornillos.'});
  const outside = M.some(([a, b]) => (a[1] === 0 && !insideBoard(a[0], a[2])) || (b[1] === 0 && !insideBoard(b[0], b[2])));
  if (outside) w.push({s:'alta', t:'Hay patas apoyadas fuera del contorno del tablero: reduzca la separación o la apertura.'});
  if (S.F + S.s/2 > S.W/2) w.push({s:'media', t:'Las patas sobresalen del borde del tablero.'});
  if (innerW < 900) w.push({s:'media', t:`Espacio libre entre estructuras de ${fmt(innerW)} mm: puede resultar incómodo para sentarse.`});
  if (interfHit(M)) w.push({s:'alta', t:(S.riostra === 'int' || S.riostra === 'ambas') ? 'Las diagonales interiores quedan en la zona de piernas. Use exteriores, o suba el travesaño.' : 'Hay piezas en la zona de piernas (≈600 × 700 mm). Esto impide sentarse cómodamente.'});
  if (lt < 300) w.push({s:'alta', t:'La altura libre bajo el tablero es insuficiente.'});
  if (S.hole && !holeOK()) w.push({s:'alta', t:'El agujero para cables queda fuera del tablero o demasiado cerca del borde. Muévalo con las posiciones X y Z.'});
  const cp = cutPlan(M);
  if (cp.over.length) w.push({s:'alta', t:`Hay piezas más largas que la tabla comprada (${cp.over.join(', ')} mm). Hay que unir o comprar tablas más largas.`});
  else if (cp.nb > S.bars) w.push({s:'media', t:`Faltan tablas: se necesitan ${cp.nb} de ${fmt(S.bar)} mm y tiene ${S.bars}.`});
  w.push({s:'info', t:'El tablero se fija siempre desde abajo, con tornillo fijo en el centro y clips en los demás puntos. Nada visible desde arriba.'});
  return w;
}

};

  return {t: `${role[0]} · ${u.role === 'brace' ? S.dS : S.s} × ${u.role === 'brace' ? S.dS : S.s} × ${u.len} mm`, x: role[1] + (u.ang > 0 ? ` Inclinación: ${u.ang}° respecto a la vertical. Ajuste la sierra a ${u.ang}° y verifique con una prueba.` : ''), svg: role[2]};

function showCard(u){

function renderPanels(M, w){
  $('warns').innerHTML = w.map(x => `<div class="adv ${x.s}">${x.t}</div>`).join('');
  const cp = cutPlan(M), P = PRESETS[S.preset];
  const groups = {};
  for (const [a, b, role] of M) {
    const L = Math.round(lenOf(a, b)), key = role + '|' + L;
    groups[key] = groups[key] || {role, L, n: 0}; groups[key].n++;
  }
  const rows = Object.values(groups).sort((x, y) => y.L - x.L).map(g => `<tr><td>${NAMES[g.role]}</td><td>${g.n}</td><td>${fmt(g.L)}</td><td>${g.role === 'brace' ? S.dS : S.s} × ${g.role === 'brace' ? S.dS : S.s}</td></tr>`).join('');
  const plan = cp.bars.map((b, i) => `<div class="muted">Tabla ${i+1}: ${b.items.map(fmt).join(' + ')} · sobra ${fmt(cp.BL + S.kerf - b.used)} mm</div>`).join('');
  $('cut').innerHTML = `
    <h3>Piezas de pino · ${P.n}</h3>
    <p class="muted">Sección de patas y travesaños: ${S.s} × ${S.s} mm. ${S.secc ? 'Sección de tablas: ' + S.secc + '.' : 'Confirme que la sección comprada sea igual o mayor.'}</p>
    <table><tr><th>Pieza</th><th>Cant.</th><th>Largo (mm)</th><th>Sección</th></tr>${rows}</table>
    <h3>Aprovechamiento de tablas</h3>
    <p>Consumo: <b>${fmt(cp.total)} mm</b>. Tablas necesarias: <b>${cp.nb}</b> de ${fmt(cp.BL)} mm (tiene ${S.bars}).</p>
    ${plan}
    <p class="muted">Lista preliminar, no de corte definitivo: no incluye tolerancias ni sobrantes de sierra.</p>`;

  $('hwlist').innerHTML = `<table><tr><th>Herraje</th><th>Medida</th><th>Uso</th></tr>
    <tr><td>Tornillo para madera</td><td>Ø5 × 25 mm (tablero) · Ø5 × 50 mm (diagonales)</td><td>Fijo central de cada travesaño, desde abajo; diagonales</td></tr>
    <tr><td>Clip de expansión</td><td>Orientativo 30 × 8 × 14 mm</td><td>Resto de fijaciones del tablero</td></tr>
    ${P.legs === 'X' ? `<tr><td>Bulón M8 + arandela plana M8 (16 × 1.6, DIN 125) + tuerca autoblocante M8 (altura 8, DIN 985)</td><td>Bulón M8 × ${BULON_L} mm</td><td>Cruce de cada X</td></tr>` : ''}</table>
    <p class="muted">Toque dos veces una pieza o herraje en la vista 3D para ver su medida exacta y su ficha. Verifique las medidas comerciales en la tienda: los tornillos y clips se venden en medidas parecidas pero no idénticas.</p>`;

  const interf = interfHit(M), tip = H_tip();
  const status = cp.over.length ? 'Piezas que no entran en la tabla' : (cp.nb > S.bars ? 'Faltan tablas' : 'Entra en el material indicado');
  $('evalbox').innerHTML = [
    ['Estabilidad geométrica', tip > 1 ? 'Requiere validación' : 'Evaluada (geométrica)', `Relación altura / base: ${tip.toFixed(2)}.`],
    ['Movimientos laterales', (P.ties.length || S.riostra !== 'no') ? 'Requiere validación profesional' : 'Advertencia: sin refuerzo', 'Depende de uniones, secciones reales y rigidez de la madera.'],
    ['Concentración de esfuerzos', 'Pendiente', 'Requiere el detalle de las uniones.'],
    ['Distribución del apoyo', 'Requiere validación profesional', 'Depende de la sección real y de la nivelación.'],
    ['Zona de piernas', interf ? 'Interferencia detectada' : 'Evaluada: libre', 'Zona estimada de 600 × 700 mm; no considera la silla real.'],
    ['Compatibilidad de uniones', 'Pendiente', 'Requiere medidas reales de la madera comprada.'],
    ['Disponibilidad de material', status, `${fmt(cp.total)} mm de piezas; ${fmt(cp.BL * S.bars)} mm disponibles.`]
  ].map(([t, s, d]) => `<div class="ev"><b>${t}</b><em>${s}</em><small>${d}</small></div>`).join('');

  const cmp = Object.keys(PRESETS).map(p => {
    const Md = members(p), c2 = cutPlan(Md);
    return `<tr class="${p === S.preset ? 'cur' : ''}"><td>${PRESETS[p].n}</td><td>${Md.length}</td><td>${fmt(c2.total)}</td><td>${c2.nb}</td><td>${interfHit(Md) ? 'Interfiere' : 'Libre'}</td></tr>`;
  }).join('');
  $('cmp').innerHTML = `<table><tr><th>Diseño</th><th>Piezas</th><th>mm</th><th>Tablas</th><th>Piernas</th></tr>${cmp}</table>`;

  const st = S.step ? STEPS[S.step - 1] : null;
  const extra = st && st.roles.includes('brace') && S.riostra === 'no' && !P.ties.length ? '<p class="muted">Este diseño no tiene diagonales ni travesaño trasero: salte este paso.</p>' : '';
  $('stepbox').innerHTML = st
    ? `<div class="ev"><b>Paso ${S.step} de ${STEPS.length} · ${st.t}</b><small>${st.x}</small>${extra}</div>`
    : `<div class="ev"><b>Vista completa</b><small>Elija un paso para ver solo las piezas que intervienen.</small></div>`;
  document.querySelectorAll('#designs button').forEach(b => b.classList.toggle('on', b.dataset.d === S.preset));
  $('hud').textContent = `${P.n} · ${fmt(S.L)} × ${fmt(S.W)} × ${S.H} mm · provisional`;
}

function sync(){
  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k, v = S[k];
    if (el.type === 'checkbox') el.checked = !!v; else if (document.activeElement !== el) el.value = v;
    const o = document.querySelector(`[data-o="${k}"]`);
    if (o) o.textContent = v + (el.dataset.u ? ' ' + el.dataset.u : '');
  });
}
function update(){
  sync();
  const M = rebuild(); applyStep();
  renderPanels(M, validate(M));
}

// ---------- Interacción ----------
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.k;
  if (!k) return;
  S[k] = el.type === 'checkbox' ? el.checked : (el.type === 'range' || el.type === 'number') ? +el.value : el.value;
  update();
});
document.addEventListener('click', e => {
  const c = e.target.dataset && e.target.dataset.corner;
  if (!c) return;
  const [sx, sz] = c.split(',').map(Number);
  S.holeX = sx * 420; S.holeZ = sz * 420; update();
});
$('designs').innerHTML = Object.entries(PRESETS).map(([k, p]) => `<button data-d="${k}"><b>${p.n}</b><small>${p.d}</small></button>`).join('');
$('designs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.preset = b.dataset.d; update(); } });
$('fb').innerHTML = groupsHTML(BOARD_G);
$('fs').innerHTML = groupsHTML(STRUCT_G);
$('steps').addEventListener('click', e => {
  const g = e.target.dataset && e.target.dataset.go;
  if (!g) return;
  if (g === 'all') S.step = 0;
  else if (g === 'next') S.step = Math.min(STEPS.length, S.step + 1);
  else S.step = Math.max(0, S.step - 1);
  update();
});
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section[data-pane]').forEach(s => s.hidden = s.dataset.pane !== b.dataset.tab);
});

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(dyn.filter(o => o.isMesh && o.visible && o.userData.kind));
  return hits.length ? hits[0].object.userData : null;
}
function keyOf(u){ return u.key; }
function onDbl(e){
  const u = pick(e);
  if (u) { sel = keyOf(u); update(); showCard(u); }
  else { sel = null; $('card').hidden = true; update(); }
}
function openDlg(kind){
  $('dlgT').textContent = kind === 'board' ? 'Medidas del tablero' : 'Medidas de la estructura';
  $('dlgF').innerHTML = groupsHTML(kind === 'board' ? BOARD_G : STRUCT_G);
  sync(); $('dlg').showModal();
}
$('dlgX').onclick = () => $('dlg').close();
$('dlgF').addEventListener('click', e => { if (e.target.dataset.corner) { const [sx, sz] = e.target.dataset.corner.split(',').map(Number); S.holeX = sx*420; S.holeZ = sz*420; update(); } });

// Doble clic con ratón; doble toque en pantallas táctiles
let lastType = 'mouse', down = null, lastTap = {t:0, x:0, y:0};
renderer.domElement.addEventListener('pointerdown', e => { lastType = e.pointerType; down = {x: e.clientX, y: e.clientY}; });
renderer.domElement.addEventListener('pointerup', e => {
  if (e.pointerType !== 'touch' || !down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) return;
  const now = Date.now();
  if (now - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) { lastTap.t = 0; onDbl(e); }
  else lastTap = {t: now, x: e.clientX, y: e.clientY};
});
renderer.domElement.addEventListener('dblclick', e => { if (lastType !== 'touch') onDbl(e); });
renderer.domElement.addEventListener('contextmenu', e => { e.preventDefault(); const u = pick(e); openDlg(u && u.kind === 'board' ? 'board' : 'struct'); });
renderer.domElement.addEventListener('pointermove', e => { renderer.domElement.style.cursor = pick(e) ? 'pointer' : 'grab'; });

// Cámara
let goal = null;
function resetCam(){
  const d = Math.max(S.L, S.W) * 0.0022, t = new V3(0, S.H * 0.0004, 0);
  goal = {p: new V3(t.x + 0.7*d, t.y + 0.8*d, t.z + 0.7*d), t};
}
$('reset').onclick = resetCam;
controls.addEventListener('start', () => goal = null);

function setTheme(t){
  S.theme = t;
  document.body.classList.toggle('light', t === 'light');
  scene.background = new THREE.Color(t === 'light' ? '#eeece7' : '#0f1114');
  $('theme').textContent = t === 'light' ? 'Modo oscuro' : 'Modo claro';
}
$('theme').onclick = () => setTheme(S.theme === 'dark' ? 'light' : 'dark');

function resize(){
  const r = view.getBoundingClientRect(), h = Math.max(r.height, 300);
  renderer.setSize(r.width, h, false);
  renderer.domElement.style.height = h + 'px';
  camera.aspect = r.width / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize(); setTheme('dark'); update();
camera.position.set(2.6, 2.6, 2.6); controls.target.set(0, 0.37, 0);
(function loop(){
  requestAnimationFrame(loop);
  if (goal) {
    camera.position.lerp(goal.p, 0.12); controls.target.lerp(goal.t, 0.12);
    if (camera.position.distanceTo(goal.p) < 0.002) goal = null;
  }
  controls.update(); renderer.render(scene, camera);
})();
</script>
</body>
</html>
